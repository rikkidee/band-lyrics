// Populate dropdown
const select = document.getElementById('songSelect');
songs.forEach((song, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${i + 1}. ${song.title} — ${song.artist}`;
  select.appendChild(opt);
});

let currentIndex = 0;

function navigate(dir) {
  const newIndex = currentIndex + dir;
  if (newIndex >= 0 && newIndex < songs.length) {
    select.value = newIndex;
    showSong(newIndex);
  }
}

function showSong(index) {
  index = parseInt(index);
  currentIndex = index;
  const song = songs[index];

  document.getElementById('songTitle').textContent = song.title;
  document.getElementById('songArtist').textContent = song.artist;

  const lyricsEl = document.getElementById('lyrics');
  const container = document.getElementById('lyricsContainer');

  // Format lyrics: convert double newlines to section breaks
  const formatted = song.lyrics
    .trim()
    .split('\n\n')
    .map(section => section.trim())
    .join('\n<div class="section-break"></div>\n');

  lyricsEl.innerHTML = formatted.replace(/\n/g, '<br>');

  // Auto-size: find the largest font that fits
  autoSize(lyricsEl, container);
}

function autoSize(lyricsEl, container) {
  const containerHeight = container.clientHeight;
  const containerWidth = container.clientWidth;

  // Try single column first
  lyricsEl.classList.remove('two-col');

  let lo = 8, hi = 42, best = 12;

  // Binary search for best font size - single column
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    lyricsEl.style.fontSize = mid + 'px';
    if (lyricsEl.scrollHeight <= containerHeight + 2) {
      best = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }

  const singleBest = best;

  // Try two columns
  lyricsEl.classList.add('two-col');
  lo = 8; hi = 42; let twoBest = 8;

  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    lyricsEl.style.fontSize = mid + 'px';
    if (lyricsEl.scrollHeight <= containerHeight + 2) {
      twoBest = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }

  // Use whichever gives bigger font
  if (twoBest > singleBest + 1) {
    lyricsEl.classList.add('two-col');
    lyricsEl.style.fontSize = twoBest + 'px';
  } else {
    lyricsEl.classList.remove('two-col');
    lyricsEl.style.fontSize = singleBest + 'px';
  }
}

// Re-fit on orientation change / resize
window.addEventListener('resize', () => {
  const lyricsEl = document.getElementById('lyrics');
  const container = document.getElementById('lyricsContainer');
  autoSize(lyricsEl, container);
});

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

// Show first song
showSong(0);
</script>
