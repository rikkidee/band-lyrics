<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Setlist Lyrics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #111;
    color: #e8e8e8;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 8px 12px;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding-bottom: 6px;
  }
  #controls button {
    background: #333;
    color: #e8e8e8;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  #controls button:active { background: #555; }
  .size-btn { padding: 8px 10px !important; font-size: 14px !important; min-width: 36px; text-align: center; }
  #songSelect {
    flex: 1;
    background: #222;
    color: #e8e8e8;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 16px;
    -webkit-appearance: none;
    appearance: none;
  }
  #header {
    text-align: center;
    flex-shrink: 0;
    padding-bottom: 4px;
  }
  #songTitle {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
  }
  #songArtist {
    font-size: 14px;
    color: #888;
    font-weight: 400;
    margin-top: 1px;
  }
  #lyricsContainer {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  #lyrics {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  #lyrics.two-col {
    column-count: 2;
    column-gap: 28px;
    column-rule: 1px solid #333;
  }
  .section-break { height: 0.6em; }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <button id="prevBtn" onclick="navigate(-1)">&#9664;</button>
    <select id="songSelect" onchange="showSong(this.value)"></select>
    <button id="nextBtn" onclick="navigate(1)">&#9654;</button>
    <button class="size-btn" onclick="adjustSize(-2)">A-</button>
    <button class="size-btn" onclick="adjustSize(2)">A+</button>
  </div>
  <div id="header">
    <div id="songTitle"></div>
    <div id="songArtist"></div>
  </div>
  <div id="lyricsContainer">
    <div id="lyrics"></div>
  </div>
</div>

const select=document.getElementById('songSelect');songs.forEach((song,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=(i+1)+'. '+song.title+' \u2014 '+song.artist;select.appendChild(opt)});

let currentIndex=0;
let sizeOffset=0;

function navigate(dir){const newIndex=currentIndex+dir;if(newIndex>=0&&newIndex<songs.length){select.value=newIndex;showSong(newIndex)}}

function adjustSize(delta){const lyricsEl=document.getElementById('lyrics');const current=parseInt(lyricsEl.style.fontSize)||20;const newSize=Math.max(8,Math.min(60,current+delta));lyricsEl.style.fontSize=newSize+'px';}

function showSong(index){index=parseInt(index);currentIndex=index;const song=songs[index];document.getElementById('songTitle').textContent=song.title;document.getElementById('songArtist').textContent=song.artist;const lyricsEl=document.getElementById('lyrics');const container=document.getElementById('lyricsContainer');const formatted=song.lyrics.trim().split('\n\n').map(s=>s.trim()).join('\n<div class="section-break"><\/div>\n');lyricsEl.innerHTML=formatted.replace(/\n/g,'<br>');autoSize(lyricsEl,container)}

function autoSize(lyricsEl,container){const containerHeight=container.clientHeight;lyricsEl.classList.remove('two-col');let lo=8,hi=42,best=12;while(lo<=hi){const mid=Math.floor((lo+hi)/2);lyricsEl.style.fontSize=mid+'px';if(lyricsEl.scrollHeight<=containerHeight+2){best=mid;lo=mid+1}else{hi=mid-1}}const singleBest=best;lyricsEl.classList.add('two-col');lo=8;hi=42;let twoBest=8;while(lo<=hi){const mid=Math.floor((lo+hi)/2);lyricsEl.style.fontSize=mid+'px';if(lyricsEl.scrollHeight<=containerHeight+2){twoBest=mid;lo=mid+1}else{hi=mid-1}}if(twoBest>singleBest+1){lyricsEl.classList.add('two-col');lyricsEl.style.fontSize=twoBest+'px'}else{lyricsEl.classList.remove('two-col');lyricsEl.style.fontSize=singleBest+'px'}}

window.addEventListener('resize',()=>{const lyricsEl=document.getElementById('lyrics');const container=document.getElementById('lyricsContainer');autoSize(lyricsEl,container)});

document.addEventListener('keydown',(e)=>{if(e.key==='ArrowLeft')navigate(-1);if(e.key==='ArrowRight')navigate(1);if(e.key==='+'||e.key==='=')adjustSize(2);if(e.key==='-')adjustSize(-2)});

showSong(0);
<\/script>
